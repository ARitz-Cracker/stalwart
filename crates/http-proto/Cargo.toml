[package]
name = "http_proto"
version = "0.16.20"
edition = "2024"

[dependencies]
common = { path = "../common" }
utils = { path = "../utils" }
tokio = {version = "1.53", default-features = false}
trc = { path = "../trc" }
registry = { path = "../registry" }
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
hyper = { version = "1.11.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body = "1.1.0"
http-body-util = "0.1.4"
form_urlencoded = "1.2.2"
percent-encoding = "2.3.2"
compact_str = "0.10.0"

[dev-dependencies]

[features]
test_mode = []
dev_mode = []
enterprise = []

[lints]
workspace = true
